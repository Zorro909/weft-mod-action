# Copy to .github/workflows/index-pr.yml in your mod's repository, and add a personal access token
# as the secret WEFT_INDEX_TOKEN (see README.md). Run it from the Actions tab: it opens a pull
# request on the Weft mod index that adds your newest releases, or the tags you name.
name: Propose to the Weft mod index

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags, separated by spaces (default, the newest release of each mod)
        default: ""

permissions:
  contents: read

jobs:
  index-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pr
        uses: Zorro909/weft-mod-action/index-pr@v1
        with:
          token: ${{ secrets.WEFT_INDEX_TOKEN }}
          tags: ${{ inputs.tags }}
          # mods: |
          #   cogwork
          #   structures
